<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory-Game</title>
    <link rel="icon" type="image/svg+xml" href="/assets/images/foods-cards/blue-pawn.svg" />
  </head>
  <body>
    <main>
      <section class="start-screen" id="start-screen">
        <img
          class="start-screen__decoration"
          src="/assets/images/controller.png"
          alt=""
        />

        <div class="start-screen__content">
          <p class="start-screen__intro">It's play time.</p>
          <h1 class="start-screen__title">Ready to play?</h1>
          <button
            class="start-screen__button"
            id="play-button"
            type="button"
            aria-label="Play"
          >
            <img
              class="start-screen__button-controller"
              src="/assets/images/controller-small.png"
              alt=""
            />

            <span class="start-screen__button-text">Play</span>

            <span class="start-screen__button-arrows">
              <img
                class="start-screen__button-arrow"
                src="/assets/images/arrow.png"
                alt=""
              />
              <img
                class="start-screen__button-arrow-thick"
                src="/assets/images/arrow-thick.png"
                alt=""
              />
            </span>
          </button>
        </div>
      </section>
      <section class="settings-screen" id="settings-screen" hidden>
        <h1 class="settings-screen__title">Settings</h1>

        <form class="settings-screen__form" id="settings-form">
          <fieldset class="settings-screen__group">
            <legend class="settings-screen__legend">
              <img
                class="settings-screen__icon"
                src="/assets/images/theme-icon.png"
                alt=""
              />
              Game themes
            </legend>

            <label>
              <input type="radio" name="theme" value="code" checked />
              Code vibes theme
            </label>

            <label>
              <input type="radio" name="theme" value="food" />
              Foods theme
            </label>
          </fieldset>

          <fieldset class="settings-screen__group">
            <legend class="settings-screen__legend">
              <img
                class="settings-screen__icon"
                src="/assets/images/player-icon.png"
                alt=""
              />
              Choose player
            </legend>

            <label>
              <input type="radio" name="player" value="blue" checked />
              Blue
            </label>

            <label>
              <input type="radio" name="player" value="orange" />
              Orange
            </label>
          </fieldset>

          <fieldset class="settings-screen__group">
            <legend class="settings-screen__legend">
              <img
                class="settings-screen__icon"
                src="/assets/images/size-icon.png"
                alt=""
              />
              Board size
            </legend>

            <label>
              <input type="radio" name="board-size" value="16" checked />
              16 cards
            </label>

            <label>
              <input type="radio" name="board-size" value="24" />
              24 cards
            </label>

            <label>
              <input type="radio" name="board-size" value="36" />
              36 cards
            </label>
          </fieldset>

          <img
            class="settings-screen__preview"
            id="theme-preview"
            src="/assets/images/code-theme.png"
            alt="Vorschau des Code-vibes-Themes"
          />

          <div class="settings-screen__summary">
            <span class="settings-screen__summary-item" id="summary-theme">
              Code vibes
            </span>

            <span class="settings-screen__summary-item" id="summary-player">
              Blue
            </span>

            <span class="settings-screen__summary-item" id="summary-size">
              16 cards
            </span>

            <button class="settings-screen__start-button" type="submit">
              <img
                class="settings-screen__start-icon"
                src="/assets/images/start-rec.png"
                alt=""
              />
              Start
            </button>
          </div>
        </form>
      </section>

      <section
        class="game-screen"
        id="game-screen"
        aria-label="Memory game"
        hidden
      >
        <header class="game-screen__header">
          <div class="game-screen__scores" aria-label="Scores">
            <span class="game-screen__player game-screen__player--blue">
              Blue <span id="score-blue">0</span>
            </span>

            <span class="game-screen__player game-screen__player--orange">
              Orange <span id="score-orange">0</span>
            </span>
          </div>

          <p class="game-screen__turn">
            Current player:
            <span class="game-screen__turn-badge">
              <img
                id="current-player"
                src="/assets/images/code-vibes-cards/label-blue.png"
                alt="Blue"
                width="24"
                height="20"
              />
            </span>
          </p>

          <button
            class="game-screen__exit"
            id="exit-game-button"
            type="button"
            aria-label="Exit game"
          ></button>
        </header>

        <div class="game-screen__board" id="game-board"></div>
      </section>
      <section
        class="game-over-screen"
        id="game-over-screen"
        aria-labelledby="game-over-title"
        hidden
      >
        <h1 class="game-over-screen__title" id="game-over-title">Game Over</h1>

        <p class="game-over-screen__label">Final Score</p>

        <div class="game-over-screen__scores">
          <span class="game-over-screen__player game-over-screen__player--blue">
            Blue <span id="final-score-blue">0</span>
          </span>

          <span
            class="game-over-screen__player game-over-screen__player--orange"
          >
            Orange <span id="final-score-orange">0</span>
          </span>
        </div>
      </section>

      <section
        class="result-screen"
        id="result-screen"
        aria-labelledby="result-title"
        hidden
      >
        <div
          class="result-screen__confetti"
          id="result-confetti"
          aria-hidden="true"
        >
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>

        <p class="result-screen__intro" id="result-intro">The winner is</p>

        <h1 class="result-screen__title" id="result-title">BLUE PLAYER</h1>

        <div
          class="result-screen__symbol"
          id="result-symbol"
          aria-hidden="true"
        ></div>

        <button
          class="result-screen__button"
          id="back-to-start-button"
          type="button"
        >
          Back to Start
        </button>
      </section>

      <dialog
        class="exit-dialog"
        id="exit-dialog"
        aria-labelledby="exit-dialog-title"
      >
        <h2 class="exit-dialog__title" id="exit-dialog-title">
          Are you sure you want to exit the game?
        </h2>

        <div class="exit-dialog__actions">
          <button
            class="exit-dialog__button exit-dialog__button--back"
            id="back-to-game-button"
            type="button"
            autofocus
          >
            Back to Game
          </button>

          <button
            class="exit-dialog__button exit-dialog__button--exit"
            id="confirm-exit-button"
            type="button"
          >
            Exit game
          </button>
        </div>
      </dialog>
    </main>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
